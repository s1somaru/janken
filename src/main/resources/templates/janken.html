<html xmlns:th="http://www.thymeleaf.org">

<body>
  <!-- ログイン中のユーザ名を表示する -->
  <p>ログインユーザ：[[${loginUser}]]</p>

  <!-- Spring Securityが用意しているログアウト確認画面へのリンク -->
  <a href="/logout">ログアウト</a>

  <!-- エントリーしている全ユーザの一覧 -->
  <h2>エントリー</h2>
  <ul>
    <!-- 一覧の名前を1つずつ取り出して表示する -->
    <li th:each="user : ${entry?.users}">[[${user}]]</li>
  </ul>

  <!-- th:if で、username が渡されているときだけこのdivを表示する -->
  <!-- /janken を直接開いたときは username が無いので、何も表示されない -->
  <div th:if="${username}">
    <!-- 渡されたユーザ名を埋め込んで表示する -->
    Hi [[${username}]]
  </div>

  <!-- クリックすると、選んだ手を記号にして /fight に送るリンク -->
  <a href="/fight?hand=gu">グー</a>
  <a href="/fight?hand=choki">チョキ</a>
  <a href="/fight?hand=pa">パー</a>

  <!-- 勝負の結果が渡されたときだけ表示する -->
  <div th:if="${janken}">
    <!-- Jankenクラスのgetterを通して、それぞれの値を表示する -->
    <p>あなたの手：[[${janken.myHand}]]</p>
    <p>相手の手：[[${janken.cpuHand}]]</p>
    <p>結果：[[${janken.result}]]</p>
  </div>
</body>
