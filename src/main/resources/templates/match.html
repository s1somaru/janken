<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>対戦</title>
</head>

<body>
  <!-- ログインユーザと対戦相手の名前を表示する -->
  <h2>[[${loginUser}]] vs [[${opponent.name}]]</h2>

  <!-- 出す手と相手のidを付けた /wait へのリンク -->
  <a th:href="@{/wait(hand='Gu', id=${opponent.id})}">グー</a>
  <a th:href="@{/wait(hand='Choki', id=${opponent.id})}">チョキ</a>
  <a th:href="@{/wait(hand='Pa', id=${opponent.id})}">パー</a>

  <!-- 勝負の結果が渡されたときだけ表示する -->
  <div th:if="${janken}">
    <p>[[${loginUser}]]の手：[[${janken.myHand}]]</p>
    <p>[[${opponent.name}]]の手：[[${janken.cpuHand}]]</p>
    <p>結果：[[${janken.result}]]</p>
  </div>

  <!-- じゃんけんページに戻るリンク -->
  <a href="/janken">もどる</a>
</body>

</html>
